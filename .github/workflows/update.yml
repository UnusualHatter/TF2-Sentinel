name: "Update Database"
on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Ingest New Data
        run: python scripts/ingest.py
        
      - name: Recompute Confidence
        run: python scripts/recompute_confidence.py
        
      - name: Export Site Data and Update README
        run: python scripts/export_site_data.py
        
      - name: Build Compact Site Bundle
        run: python scripts/build_site_bundle.py

      - name: Generate SOURCES.md
        run: python scripts/generate_sources_md.py
        
      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automated database update"
          file_pattern: "data/ docs/ SOURCES.md README.md"
