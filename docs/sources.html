<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Public source catalog used by TF2 Sentinel.">
<meta name="theme-color" content="#0d1117">
<title>Sources · TF2 Sentinel</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="with-sticky-tools">
<main class="page-shell">
<header class="site-header">
  <div class="brand">
    <img class="brand-logo" src="assets/sentinel-logo.png" alt="" width="58" height="58">
    <div><h1>Source catalog</h1><p>Registered public sources, provenance groups and confidence weights.</p></div>
  </div>
  <div class="db-update" id="last-update">Last database update: —</div>
</header>
<div class="sticky-tools">
  <section class="controls source-controls"><input id="q" type="search" placeholder="Filter source, type, region or method" autocomplete="off"><div></div></section>
  <div class="result-bar"><div id="stats" class="stats">Loading sources…</div></div>
</div>
<div class="table-wrap">
<table class="source-table">
<thead><tr><th>ID</th><th>Source</th><th>Type</th><th>Region</th><th>Records</th><th>Weight</th><th>Counts</th><th>Method</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
<footer class="site-footer"><a href="index.html">accounts</a><a href="servers.html">South America servers</a><a href="data/sources.json">sources.json</a></footer>
</main>
<script src="sources.js"></script>
</body>
</html>
