<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="South American TF2 server references tracked by TF2 Sentinel.">
<meta name="theme-color" content="#0d1117">
<title>South America servers · TF2 Sentinel</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page-shell">
<header class="site-header">
  <div class="brand"><img class="brand-logo" src="assets/sentinel-logo.png" alt="" width="58" height="58"><div><h1>South America servers</h1><p>Server references used to look for public moderation and cheating-ban records.</p></div></div>
  <div class="db-update" id="last-update">Last database update: —</div>
</header>
<div class="table-wrap"><table class="server-table"><thead><tr><th>Server</th><th>Country</th><th>Address</th><th>Public moderation data</th></tr></thead><tbody id="rows"></tbody></table></div>
<footer class="site-footer"><a href="index.html">accounts</a><a href="sources.html">sources</a><a href="data/servers.json">servers.json</a></footer>
</main>
<script src="lib/sentinel-data.js" defer></script>
<script>
'use strict';
document.addEventListener('DOMContentLoaded', function () {
  var esc = SentinelData.escapeHtml;
  Promise.all([
    fetch('data/servers.json').then(function (r) { return r.json(); }),
    fetch('data/meta.json').then(function (r) { return r.json(); }).catch(function () { return {}; })
  ]).then(function (loaded) {
    var servers = loaded[0];
    var meta = loaded[1];
    document.getElementById('last-update').textContent =
      'Last database update: ' + (meta.last_database_update_display || '\u2014');
    document.getElementById('rows').innerHTML = servers.map(function (row) {
      var url = SentinelData.safeUrl(row.public_moderation_url);
      var label = /sourcebans|banlist/i.test((row.public_moderation_url || '') + ' ' + (row.notes || ''))
        ? 'Ban list' : 'Moderation site';
      var link = url
        ? '<a href="' + esc(url) + '" target="_blank" rel="noreferrer">' + label + '</a>'
        : '<span class="muted">No public ban list located</span>';
      var note = row.notes ? '<div class="server-note">' + esc(row.notes) + '</div>' : '';
      return '<tr><td>' + esc(row.server_name) + '</td><td>' + esc(row.country) + '</td>'
        + '<td class="mono">' + esc(row.address) + '</td><td>' + link + note + '</td></tr>';
    }).join('');
  });
});
</script>
</body>
</html>
